[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "star-rail-agents-api"
version = "0.1.0"
description = "Multi-Agent and RAG game assistant API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "httpx==0.28.1",
  "langchain==0.3.13",
  "langchain-openai==0.2.14",
  "pymilvus==2.5.2",
  "setuptools==80.9.0",
  "alembic==1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4",
  "python-docx==1.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
