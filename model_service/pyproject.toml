[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "star-rail-bge-service"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sentence-transformers==3.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
